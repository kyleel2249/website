<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <script>document.documentElement.className = 'js';</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password · Cintexa Member Portal</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="../css/portal.css">
</head>
<body class="portal-auth">
  <div class="auth-shell">
    <div class="auth-visual" aria-hidden="true">
      <div class="auth-brand">
        <img src="/assets/logo.svg" alt="" width="36" height="36">
        <span>Cintexa</span>
      </div>
    </div>
    <div class="auth-panel">
      <div class="auth-panel-inner">
        <h1>Reset your password</h1>
        <p class="auth-lede">Enter the email associated with your account. We’ll send a secure reset link.</p>
        <form id="forgot-form" class="auth-form" novalidate>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email">
          </div>
          <div id="auth-error" class="form-error" role="alert" hidden></div>
          <div id="auth-success" class="form-success" role="status" hidden></div>
          <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Send Reset Link</button>
        </form>
        <p class="auth-footer-text"><a href="/portal/sign-in.html">← Back to sign in</a></p>
      </div>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth-service.js"></script>
  <script src="../js/portal-auth-ui.js"></script>
</body>
</html>
